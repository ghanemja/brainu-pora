# Render Blueprint — one-click backend deploy.
# Render → New → Blueprint → pick this repo. It reads this file.
#
# After deploy: copy the service URL (e.g. https://brain-u.onrender.com) and
# set it as BU_API_BASE on Netlify (the frontend).

services:
  - type: web
    name: brain-university-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # podcast/video render needs RAM; 'starter' may OOM
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: brain-data
      mountPath: /data       # SQLite + rendered media persist here
      sizeGB: 5
    envVars:
      # ── LLM: pick ONE path ──────────────────────────────────────────────
      # Path A (ship now): set ANTHROPIC_API_KEY, leave LLM_BACKEND unset.
      - key: ANTHROPIC_API_KEY
        sync: false          # set the secret in the Render dashboard
      # Path B (hosted Gemma): uncomment + fill these, then it ignores Claude.
      # - key: LLM_BACKEND
      #   value: local
      # - key: LOCAL_LLM_BASE
      #   value: https://<your-hf-endpoint>.endpoints.huggingface.cloud/v1
      # - key: LOCAL_LLM_MODEL
      #   value: tgi
      # - key: LOCAL_LLM_KEY
      #   sync: false
      # ── App ─────────────────────────────────────────────────────────────
      - key: BRAIN_DB
        value: /data/brain_university.db
      # ── Persistence — Postgres (recommended for prod) ────────────────────
      # Create a Render Postgres (New → PostgreSQL), then paste its
      # Internal Database URL into the dashboard as DATABASE_URL. Unset →
      # SQLite at BRAIN_DB on the disk above (single instance/worker only;
      # data survives restarts but not disk loss). postgres:// URLs are
      # normalized automatically (atp/db.py).
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false          # e.g. https://brain-u.netlify.app
      # ── Auth — bearer-token gate over every mutating endpoint ───────────
      # See api/auth.py. BU_AUTH_DISABLED must remain unset in prod.
      - key: BU_AUTH_USER
        sync: false          # e.g. admin
      - key: BU_AUTH_PASSWORD
        sync: false          # 16+ char random recommended
      - key: BU_AUTH_SECRET
        sync: false          # 48+ char random; rotate to revoke all sessions
      - key: BU_AUTH_TTL_HOURS
        value: "24"
