<title>PoRA Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An unofficial study companion to Principles of Robot Autonomy: answer two questions and get a short path of lessons, each with its lecture, notebook, and a quick check.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* One centered card, one question at a time, like Brain University's Trailhead.
   Tokens mirror design/styles.css; when embedded, the script copies the parent's live palette. */
:root {
  --bg: #efebe2; --bg-elev: #f6f3ec; --bg-elev-2: #fbf9f4;
  --ink: #1a1d2b; --ink-muted: #565b6c; --ink-dim: #868b9a;
  --line: rgba(26, 29, 43, 0.10); --line-strong: rgba(26, 29, 43, 0.22);
  --accent: #c2410c; --accent-ink: #ffffff; --good: #15803d; --bad: #b91c1c; --link: #1e6fa8;
  --f-sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 40px rgba(0,0,0,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-embedded]) {
    --bg: #0d1220; --bg-elev: #131a2c; --bg-elev-2: #1a2238;
    --ink: #eef1f8; --ink-muted: #a3abc2; --ink-dim: #6b7390;
    --line: rgba(160, 190, 230, 0.13); --line-strong: rgba(160, 190, 230, 0.26);
    --accent: #fb923c; --accent-ink: #1c0d03; --good: #4ade80; --bad: #f87171; --link: #7dd3fc;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-embedded]) {
  --bg: #0d1220; --bg-elev: #131a2c; --bg-elev-2: #1a2238;
  --ink: #eef1f8; --ink-muted: #a3abc2; --ink-dim: #6b7390;
  --line: rgba(160, 190, 230, 0.13); --line-strong: rgba(160, 190, 230, 0.26);
  --accent: #fb923c; --accent-ink: #1c0d03; --good: #4ade80; --bad: #f87171; --link: #7dd3fc;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root[data-tone="dark"] {
  --accent: #fb923c; --accent-ink: #1c0d03; --good: #4ade80; --bad: #f87171; --link: #7dd3fc;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 var(--f-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 56px; display: grid; gap: 22px; }
.tag { font: 500 11.5px var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
.head { text-align: center; display: grid; gap: 8px; }
.head h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.025em; text-wrap: balance; }
.head p { margin: 0; color: var(--ink-muted); }

.card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 26px; display: grid; gap: 18px; min-width: 0; }
@media (max-width: 520px) { .card { padding: 18px; } }
.card h2 { margin: 0; font-size: 22px; letter-spacing: -0.015em; line-height: 1.25; text-wrap: balance; }
.step { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .choices { grid-template-columns: minmax(0, 1fr); } }
.choice { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 3px; align-content: start; padding: 14px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--bg-elev-2); min-width: 0; }
.choice b { font-size: 15px; font-weight: 600; }
.choice span { font-size: 13px; color: var(--ink-muted); }
.choice:hover { border-color: var(--ink-muted); }
.choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice.wide { grid-column: 1 / -1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 22px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--bg-elev-2); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { min-height: 34px; padding: 6px 14px; font-size: 13.5px; }
.link { all: unset; cursor: pointer; color: var(--link); font-size: 14px; }
.link:hover { text-decoration: underline; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

ol.path { list-style: none; margin: 0; padding: 0; display: grid; max-height: 340px; overflow: auto; }
ol.path li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
ol.path li:last-child { border-bottom: 0; }
ol.path .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--f-mono); border: 1px solid var(--line-strong); color: var(--ink-muted); }
ol.path li.done .n { background: var(--good); border-color: var(--good); color: #fff; }
ol.path li.next .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
ol.path small { font: 500 11px var(--f-mono); color: var(--ink-dim); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.hint { font-size: 13px; color: var(--ink-muted); }

.more { display: grid; gap: 12px; justify-items: center; text-align: center; }
details { width: 100%; text-align: left; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; color: var(--ink-muted); font-size: 14px; text-align: center; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: " ▾"; }
details[open] summary::after { content: " ▴"; }
.chapters { display: grid; gap: 14px; margin-top: 14px; }
.chapters h3 { margin: 0 0 4px; font-size: 13px; color: var(--ink-dim); font-weight: 600; }
.chapters ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.chapters button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; padding: 6px 4px; font-size: 14.5px; border-radius: 6px; width: 100%; }
.chapters button:hover { background: var(--bg-elev); }
.chapters button:focus-visible { outline: 2px solid var(--accent); }
.chapters button span { font: 500 11.5px var(--f-mono); color: var(--ink-dim); min-width: 22px; padding-top: 2px; }

/* Lesson view: standalone only. Inside Brain University, lessons are The Walk. */
.lesson { gap: 22px; }
.lesson h2 { font-size: clamp(24px, 4vw, 30px); }
.lesson .sum { margin: 0; color: var(--ink-muted); font-size: 16px; }
.sec { display: grid; gap: 8px; min-width: 0; }
.sec h3 { margin: 0; font: 600 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
ol.ideas { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-elev-2); }
.row b { font-size: 14.5px; display: block; }
.row small { font: 500 11.5px var(--f-mono); color: var(--ink-dim); }
.video { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: var(--r-sm); overflow: hidden; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.quiz { display: grid; gap: 8px; }
.quiz p { margin: 0; font-weight: 500; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--bg-elev-2); font-size: 14.5px; }
.opt span:first-child { font: 600 12px var(--f-mono); color: var(--ink-dim); padding-top: 2px; }
.opt:hover:not([disabled]) { border-color: var(--ink-muted); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg-elev-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--bg-elev-2)); }
.opt[disabled] { cursor: default; }
.why { font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg-elev-2); }
.why b.ok { color: var(--good); } .why b.no { color: var(--bad); }
.try { font-size: 14.5px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
footer { text-align: center; font-size: 12.5px; color: var(--ink-dim); display: grid; gap: 4px; }
footer p { margin: 0; }
</style>

<div class="wrap">
  <header class="head">
    <div class="tag">Unofficial study companion</div>
    <h1>Principles of Robot Autonomy</h1>
    <p>Stanford's free robot autonomy textbook, one short lesson at a time. <a href="https://porabook.com/" target="_blank" rel="noopener">Read the book ↗</a></p>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer>
    <p>Not affiliated with the book's authors, Stanford, or Cambridge University Press. Lessons are an independent study aid; the book is the reference.</p>
    <p id="credits"></p>
  </footer>
</div>

<script>
const PORA = /*PORA_DATA*/null;
(function () {
  "use strict";
  const D = PORA, C = {};
  D.concepts.forEach(c => { C[c.id] = c; });
  const chap = {}; D.chapters.forEach(ch => chap[ch.n] = ch);
  const EMBED = /[?&]embed=bu\b/.test(location.search);
  const LINK_ONLY = window.PORA_LINK_ONLY === true;   // set by hosts that cannot frame YouTube
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // Follow Brain University's palette when embedded.
  const root = document.documentElement;
  const syncTheme = () => {
    let src = null;
    try { if (EMBED && parent !== window && parent.document) src = parent.document.documentElement; } catch (e) { src = null; }
    if (!src) return;
    root.setAttribute("data-embedded", "");
    const cs = parent.getComputedStyle(src);
    const map = { bg: "--c-bg", "bg-elev": "--c-bg-elev", "bg-elev-2": "--c-bg-elev-2", ink: "--c-ink", "ink-muted": "--c-ink-muted", "ink-dim": "--c-ink-dim", line: "--c-line", "line-strong": "--c-line-strong" };
    let bg = "";
    for (const k in map) { const v = cs.getPropertyValue(map[k]).trim(); if (v) { root.style.setProperty("--" + k, v); if (k === "bg") bg = v; } }
    const m = bg.match(/^#([0-9a-f]{6})$/i);
    if (m) { const n = parseInt(m[1], 16), L = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; root.setAttribute("data-tone", L < 0.5 ? "dark" : "light"); }
  };
  syncTheme();
  try { if (EMBED && parent !== window) new parent.MutationObserver(syncTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ["data-palette", "style", "class"] }); } catch (e) {}

  // ── Path planning: everything the goal needs, minus what the background knows ──
  const depth = {};
  const dfs = id => depth[id] ?? (depth[id] = C[id].prereqs.length ? 1 + Math.max(...C[id].prereqs.map(dfs)) : 0);
  D.concepts.forEach(c => dfs(c.id));
  const chKey = id => C[id].ch ?? -1;
  const ancestors = id => { const s = new Set(); const go = x => C[x].prereqs.forEach(p => { if (!s.has(p)) { s.add(p); go(p); } }); go(id); return s; };
  const topo = ids => { const set = new Set(ids), out = [], seen = new Set();
    const visit = x => { if (seen.has(x)) return; seen.add(x); C[x].prereqs.filter(p => set.has(p)).sort((a, b) => chKey(a) - chKey(b)).forEach(visit); out.push(x); };
    [...set].sort((a, b) => chKey(a) - chKey(b) || depth[a] - depth[b]).forEach(visit); return out; };
  const BACKGROUND = D.concepts.filter(c => c.ch == null).map(c => c.id);
  const ALL = "__all";
  function pathFor(bgId, goal) {
    const b = D.backgrounds.find(x => x.id === bgId) || D.backgrounds[0];
    const need = goal === ALL ? new Set(D.concepts.map(c => c.id)) : new Set([goal, ...ancestors(goal)]);
    return topo([...need].filter(x => x === goal || !b.knows.includes(x)));
  }
  const chLabel = n => n == null ? "Background" : n === 0 ? "Getting started" : "Ch " + n;
  const chLong = n => n == null ? "Assumed background" : n === 0 ? "Getting started" : "Chapter " + n;

  // ── State ────────────────────────────────────────────────────────────
  const S = Object.assign({ view: "bg", bg: null, goal: null, i: 0 }, store.get("pora-simple", {}));
  if (!D.backgrounds.some(b => b.id === S.bg)) S.bg = null;
  if (S.goal !== ALL && !C[S.goal]) S.goal = null;
  let custom = null;   // a one-off list: the background refresher or one chapter
  const done = new Set((store.get("pora-done", []) || []).filter(id => C[id]));
  const save = () => store.set("pora-simple", { view: custom ? "path" : S.view, bg: S.bg, goal: S.goal, i: custom ? 0 : S.i });
  const markDone = id => { done.add(id); store.set("pora-done", [...done]); };
  const steps = () => custom ? custom.steps : (S.bg && S.goal ? pathFor(S.bg, S.goal) : []);
  const go = (view, extra) => { Object.assign(S, extra || {}, { view }); save(); render(); window.scrollTo({ top: 0 }); };

  // Inside Brain University a path becomes a Walk; standalone it opens here as lessons.
  const start = (ids, label) => {
    if (EMBED) {
      const w = ids.filter(id => C[id]).map(id => C[id].wiki);
      try { parent.postMessage({ type: "pora:walk", label, steps: w }, location.origin); } catch (e) {}
      return;
    }
    const first = ids.findIndex(id => !done.has(id));
    go("lesson", { i: first < 0 ? 0 : first });
  };

  // ── Views ────────────────────────────────────────────────────────────
  const stepTag = (n, back) => `<div class="step"><span class="tag">Step ${n} of 2</span>${back ? `<button class="link" type="button" data-back="${back}">← Back</button>` : ""}</div>`;
  const viewBg = () => `<section class="card">${stepTag(1)}<h2>Where are you starting from?</h2>
    <div class="choices">${D.backgrounds.map(b => `<button class="choice" type="button" data-bg="${b.id}"><b>${esc(b.name)}</b><span>${esc(b.blurb)}</span></button>`).join("")}</div></section>`;
  const viewGoal = () => `<section class="card">${stepTag(2, "bg")}<h2>What do you want to be able to do?</h2>
    <div class="choices">${(D.goals || []).map(g => `<button class="choice" type="button" data-goal="${g.id}"><b>${esc(g.label)}</b><span>${esc(g.blurb)}</span></button>`).join("")}
    <button class="choice wide" type="button" data-goal="${ALL}"><b>Everything, in book order</b><span>The whole course, ${D.concepts.length} lessons.</span></button></div></section>`;
  function viewPath() {
    const ids = steps(), b = D.backgrounds.find(x => x.id === S.bg);
    const g = S.goal === ALL ? "the whole course" : ((D.goals || []).find(x => x.id === S.goal) || { label: C[S.goal].name }).label;
    const next = ids.findIndex(id => !done.has(id)), started = ids.some(id => done.has(id));
    const label = EMBED ? (started ? "Continue the walk" : "Start the walk") : (started ? "Continue" : "Start lesson 1");
    return `<section class="card">
      <div class="step"><span class="tag">Your path · ${ids.length} lesson${ids.length === 1 ? "" : "s"}</span><button class="link" type="button" data-back="bg">Change answers</button></div>
      <h2>${esc(g)}</h2>
      <ol class="path">${ids.map((id, i) => `<li class="${done.has(id) ? "done" : i === next ? "next" : ""}"><span class="n">${done.has(id) ? "✓" : i + 1}</span><span>${esc(C[id].name)}</span><small>${chLabel(C[id].ch)}</small></li>`).join("")}</ol>
      <div class="actions"><button class="btn primary" type="button" data-start>${label} →</button>
        <span class="hint">Starting from: ${esc(b.name)}. Each lesson has key ideas, the lecture, the notebook, and a quick check.</span></div>
    </section>`;
  }
  const viewMore = () => `<div class="more">
    <button class="link" type="button" data-refresh>Need a refresher first? Brush up on the assumed background (${BACKGROUND.length} lessons) →</button>
    <details><summary>Or open one chapter</summary><div class="chapters">${D.parts.map(p => `<div><h3>${esc(p.name)}</h3><ul>${p.chapters.map(n => `<li><button type="button" data-ch="${n}"><span>${n}</span>${esc(chap[n].title)}</button></li>`).join("")}</ul></div>`).join("")}</div></details>
  </div>`;
  function lectureHTML(L) {
    const id = (String(L.url).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/) || [])[1];
    if (!LINK_ONLY && id) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1" title="${esc(L.course)} lecture ${L.n}: ${esc(L.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    return `<div class="row"><div><b>${esc(L.title)}</b><small>Stanford ${esc(L.course)} · lecture ${L.n}</small></div><a class="btn sm" href="${esc(L.url)}" target="_blank" rel="noopener">Watch on YouTube ↗</a></div>`;
  }
  const nbName = p => p.split("/").pop().replace(".ipynb", "").replace(/_/g, " ").replace(/\b\w/g, m => m.toUpperCase());
  function viewLesson() {
    const ids = steps(); S.i = Math.max(0, Math.min(S.i, ids.length - 1));
    const id = ids[S.i], c = C[id], ch = c.ch != null ? chap[c.ch] : null, k = c.check, last = S.i === ids.length - 1;
    return `<section class="card lesson">
      <div class="step"><span class="tag">Lesson ${S.i + 1} of ${ids.length} · ${chLong(c.ch)}</span><button class="link" type="button" data-back="path">${custom ? "← Back" : "← My path"}</button></div>
      <div class="sec"><h2>${esc(c.name)}</h2><p class="sum">${esc(c.summary)}</p></div>
      <div class="sec"><h3>Key ideas</h3><ol class="ideas">${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>
      ${c.lectures.length ? `<div class="sec"><h3>Watch</h3>${c.lectures.map(l => lectureHTML(D.lectures[l])).join("")}</div>` : ""}
      ${c.exercises.length ? `<div class="sec"><h3>Run</h3>${c.exercises.map(p => `<div class="row"><div><b>${esc(nbName(p))}</b><small>${/\/exercises\//.test(p) ? "Exercise" : "Demo"} notebook</small></div><a class="btn sm primary" href="${esc(D.exerciseBase.colab + p)}" target="_blank" rel="noopener">Open in Colab ↗</a></div>`).join("")}</div>` : ""}
      ${ch ? `<div class="sec"><h3>Read</h3><div class="row"><div><b>${esc(ch.title)}</b><small>${chLong(c.ch)} · porabook.com</small></div><a class="btn sm" href="${esc(ch.url)}" target="_blank" rel="noopener">Read ↗</a></div></div>` : ""}
      <div class="sec"><h3>Quick check</h3><div class="quiz" data-check="${id}"><p>${esc(k.q)}</p>${k.choices.map((x, i) => `<button class="opt" type="button" data-opt="${i}"><span>${"ABCD"[i]}</span><span>${esc(x)}</span></button>`).join("")}<div class="why" hidden></div></div></div>
      <div class="sec"><h3>Try it</h3><div class="try">${esc(c.tryIt)}</div></div>
      <div class="nav">${S.i > 0 ? `<button class="btn" type="button" data-step="-1">← Previous</button>` : "<span></span>"}
        <button class="btn primary" type="button" data-step="1" data-done="${id}">${last ? "Done, finish ✓" : "Done, next lesson →"}</button></div>
    </section>`;
  }
  const viewFinished = () => `<section class="card" style="text-align:center;justify-items:center"><span class="tag">Path complete</span>
    <h2>You finished every lesson on this path.</h2><button class="btn primary" type="button" data-back="goal">Choose another goal</button></section>`;
  function render() {
    let html;
    if (S.view === "lesson" && !EMBED && steps().length) html = viewLesson();
    else if (S.view === "finished") html = viewFinished();
    else if (!S.bg || S.view === "bg") html = viewBg();
    else if (!S.goal || S.view === "goal") html = viewGoal();
    else html = viewPath();
    $("#main").innerHTML = html + (S.view === "lesson" && !EMBED ? "" : viewMore());
  }

  // ── Events ───────────────────────────────────────────────────────────
  document.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    const d = t.dataset;
    if (d.bg) { custom = null; go(S.goal ? "path" : "goal", { bg: d.bg }); }
    else if (d.goal) { custom = null; go("path", { goal: d.goal, i: 0 }); }
    else if (d.back) { custom = null; go(d.back); }
    else if ("start" in d) start(steps(), S.goal === ALL ? "Principles of Robot Autonomy" : C[S.goal] ? C[S.goal].name : "PoRA");
    else if ("refresh" in d) { custom = { steps: topo(BACKGROUND) }; start(custom.steps, "Assumed background"); }
    else if (d.ch) { const n = +d.ch, ids = topo(D.concepts.filter(c => c.ch === n).map(c => c.id)); if (!ids.length) return; custom = { steps: ids }; start(ids, chap[n].title); }
    else if (d.step) {
      if (d.done) markDone(d.done);
      const n = S.i + (+d.step);
      if (n < steps().length) go("lesson", { i: n });
      else { const wasCustom = !!custom; custom = null; go(wasCustom ? "path" : "finished"); }
    }
    else if (d.opt) {
      const q = t.closest("[data-check]"), c = C[q.dataset.check], k = c.check, i = +d.opt, ok = i === k.correct;
      q.querySelectorAll(".opt").forEach((o, j) => { o.disabled = true; if (j === k.correct) o.classList.add("right"); else if (j === i) o.classList.add("wrong"); });
      const w = q.querySelector(".why"); w.hidden = false;
      w.innerHTML = `<b class="${ok ? "ok" : "no"}">${ok ? "Correct." : "Not quite."}</b> ${esc(k.why)}`;
      if (ok) markDone(c.id);
    }
  });

  $("#credits").innerHTML = `Lectures: Stanford AA174A and AA203. Notebooks: <a href="${esc(D.meta.exercisesRepo)}" target="_blank" rel="noopener">StanfordASL/pora-exercises</a>.`;
  if (S.view === "lesson") S.view = S.goal ? "path" : "bg";   // reopen on the path, not mid-lesson
  render();
  window.PORA_ATLAS = { state: () => Object.assign({}, S), steps };
})();
</script>
