# FalkorDB — lightweight Redis-based graph database for Graphiti
#
# Usage:
#   cd docker
#   docker compose up -d
#   # FalkorDB browser: http://localhost:3000
#   # Bolt-style endpoint:  redis://localhost:6379

version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: gemma-eng-falkordb
    ports:
      - "6379:6379"     # graph queries
      - "3001:3000"     # web UI (3001 because 3000 is often used for grafana/etc.)
    volumes:
      - falkordb_data:/data
    # NOTE: bulk ingests (e.g. wiki_to_graphiti — 1,220 pages) trip the
    # default MAX_QUEUED_QUERIES=25 limit. After `docker compose up -d`,
    # bump it once at runtime:
    #   redis-cli -p 6379 GRAPH.CONFIG SET MAX_QUEUED_QUERIES 1000
    # And throttle Graphiti's parallelism before running the ingest:
    #   export SEMAPHORE_LIMIT=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  falkordb_data:
