<!doctype html>

<meta charset="utf-8" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Tweak-driven font-family overrides applied to root */
html[data-display-font="serif"]   { --f-display: "Fraunces", "Iowan Old Style", Georgia, serif; }
html[data-display-font="grotesk"] { --f-display: "Geist", "General Sans", system-ui, sans-serif; }
html[data-display-font="mono"]    { --f-display: "JetBrains Mono", "SF Mono", Menlo, monospace; }
</style>

<body>
  <!-- Backend URL set before boot. config.js is generated at deploy time. -->
  <script src="config.js"></script>
  <script>
    window.BU_API_BASE = window.BU_API_BASE || "http://localhost:8090";
    window.BU_USER_ID  = localStorage.getItem("bu_user_id")
                       || (() => { const id = "anon-" + Math.random().toString(36).slice(2,10);
                                   localStorage.setItem("bu_user_id", id); return id; })();
  </script>
  <script>
    // Open demo — no login screen. Silently mint a bearer token with the demo
    // account so the (auth-protected) backend still accepts requests. The app
    // renders immediately; api.js attaches the token once it lands. Try the
    // legacy /login first, then the Phase-2 org login (/auth/login).
    (function(){
      var apiBase = (window.BU_API_BASE || "http://localhost:8090").replace(/\/+$/,"");
      try { if (sessionStorage.getItem('bu_auth_token')) return; } catch(_){}
      function store(d){ if (d && d.token) { try { sessionStorage.setItem('bu_auth_token', d.token); } catch(_){} } }
      var creds = { username: "admin", password: "MJiqvzRqd9SVfw2kmI65og" };
      fetch(apiBase + '/login', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(creds) })
        .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
        .then(store)
        .catch(function(){
          // Legacy rejected — try org login with {email, password}.
          fetch(apiBase + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ email: creds.username, password: creds.password }) })
            .then(function(r){ return r.ok ? r.json() : null; })
            .then(store).catch(function(){});
        });
    })();
  </script>
  <div id="root"></div>

  <!-- Shim window.process for libraries that check process.env.NODE_ENV.   -->
  <!-- 3d-force-graph 1.73.4 references it internally; without the shim it  -->
  <!-- throws 'process is not defined' and the WebGL canvas stays blank.    -->
  <script>window.process = window.process || { env: { NODE_ENV: "production" } };</script>

  <!-- Prod/dev script-loading switch (docs/HARDENING.md Phase 5).           -->
  <!-- If .compiled/manifest.json exists (deploy artifact written by         -->
  <!-- scripts/build_frontend.mjs at Netlify build time), load self-hosted   -->
  <!-- production React + vendored three/3d-force-graph and, once the DOM is -->
  <!-- parsed, inject the precompiled .compiled/*.js in the exact order of   -->
  <!-- the type="text/babel" tags below (which stay inert without Babel).    -->
  <!-- Otherwise: EXACTLY the zero-build dev path — pinned CDN dev React +   -->
  <!-- in-browser Babel compiling the raw .jsx tags. Login gate + config.js  -->
  <!-- already ran above; data.js/api.js keep loading between frameworks and -->
  <!-- app code in both modes.                                               -->
  <script>
  (function () {
    var manifest = null;
    try {
      var xhr = new XMLHttpRequest();
      // Synchronous on purpose: the prod/dev decision must be made before the
      // parser reaches the script tags below. ?t= defeats stale caches; a
      // SPA-rewritten HTML response (deploy without build) fails JSON.parse
      // and falls through to dev mode.
      xhr.open("GET", ".compiled/manifest.json?t=" + Date.now(), false);
      xhr.send(null);
      if (xhr.status === 200) {
        var m = JSON.parse(xhr.responseText);
        // Only trust bundles from the current build format (see
        // scripts/build_frontend.mjs); anything older falls back to dev mode.
        if (m && typeof m === "object" && m.__format === 2) manifest = m;
      }
    } catch (_) { manifest = null; }
    window.__BU_COMPILED = manifest;
    function tag(src, attrs) {
      document.write('<script src="' + src + '"' + (attrs || "") + '><\/script>');
    }
    if (manifest) {
      // PROD — self-hosted, no CDN, no Babel (design/vendor/, pinned+hashed).
      tag("vendor/react.production.min.js");
      tag("vendor/react-dom.production.min.js");
      tag("vendor/three.min.js");
      tag("vendor/3d-force-graph.min.js");
      document.addEventListener("DOMContentLoaded", function () {
        var babels = document.querySelectorAll('script[type="text/babel"]');
        var inlineIdx = 0;
        for (var i = 0; i < babels.length; i++) {
          var src = babels[i].getAttribute("src");
          var key = src ? src.split("?")[0].replace(/\.jsx$/, ".js")
                        : "_inline_" + (inlineIdx++) + ".js";
          var s = document.createElement("script");
          s.async = false; // execute in insertion order, same as the tags
          s.src = ".compiled/" + key + (manifest[key] ? "?v=" + manifest[key] : "");
          document.body.appendChild(s);
        }
      });
    } else {
      // DEV — React + Babel pinned (unchanged zero-build path).
      tag("https://unpkg.com/react@18.3.1/umd/react.development.js",
          ' integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"');
      tag("https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js",
          ' integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"');
      tag("https://unpkg.com/@babel/standalone@7.29.0/babel.min.js",
          ' integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"');
      tag("https://unpkg.com/three@0.150.0/build/three.min.js");
      tag("https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js");
    }
  })();
  </script>

  <!-- Data layer (no JSX, plain JS) -->
  <script src="data.js"></script>
  <script src="courses/pora_bu.js?v=2"></script>
  <script src="atp_data.js?v=1"></script>

  <!-- API client. BU_API_BASE + config.js already loaded above (before the -->
  <!-- gate), so api.js just needs the cache-busted include here.            -->
  <script>document.write('<script src="api.js?v=' + Date.now() + '"><\/script>');</script>

  <!-- Component libraries (each Babel-compiled, exports to window) -->
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="atp-atoms.jsx?v=1"></script>
  <script type="text/babel" src="brain-graph.jsx?v=4"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tutorial.jsx?v=3"></script>
  <script type="text/babel" src="atp-tour.jsx?v=1"></script>
  <script type="text/babel" src="interactive-exercises.jsx"></script>
  <script type="text/babel" src="podcast-player.jsx"></script>

  <!-- Screens -->
  <script type="text/babel" src="screens/trailhead.jsx?v=2"></script>
  <script type="text/babel" src="screens/walk.jsx"></script>
  <script type="text/babel" src="screens/branch-and-summit.jsx"></script>
  <script type="text/babel" src="screens/dashboard-and-propose.jsx?v=2"></script>
  <script type="text/babel" src="screens/threed-flex.jsx?v=2"></script>
  <script type="text/babel" src="screens/arxivis.jsx?v=8"></script>
  <script type="text/babel" src="screens/open-problems.jsx?v=1"></script>
  <script type="text/babel" src="screens/podcast.jsx?v=2"></script>
  <script type="text/babel" src="screens/courses.jsx?v=2"></script>

  <!-- ATP agent-view screens -->
  <script type="text/babel" src="screens/atp-university.jsx?v=1"></script>
  <script type="text/babel" src="screens/atp-agents.jsx?v=3"></script>
  <script type="text/babel" src="screens/atp-certs.jsx?v=2"></script>
  <script type="text/babel" src="screens/atp-marketplace.jsx?v=2"></script>
  <script type="text/babel" src="screens/atp-governance.jsx?v=3"></script>
  <script type="text/babel" src="screens/atp-vault.jsx?v=2"></script>

  <!-- Main app shell -->
  <script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "paper",
  "displayFont": "grotesk",
  "lessonLayout": "postcard",
  "showMinimap": true,
  "cinematicCamera": true
}/*EDITMODE-END*/;

const SCREENS_HUMAN = [
  { id: "trailhead", label: "Trailhead",  hint: "01" },
  { id: "walk",      label: "The walk",   hint: "02" },
  { id: "branch",    label: "Bridge",     hint: "03" },
  { id: "summit",    label: "Summit",     hint: "04" },
  { id: "dashboard", label: "Dashboard",  hint: "05" },
  { id: "propose",   label: "Propose",    hint: "06" },
  { id: "explorer",  label: "3D mode",    hint: "07" },
  { id: "arxivis",   label: "arXivis",    hint: "08" },
  { id: "openprob",  label: "open problems", hint: "09" },
  { id: "podcast",   label: "Podcast",    hint: "10" },
  { id: "courses",   label: "Courses",    hint: "11" },
];

const SCREENS_AGENT = [
  { id: "university",  label: "University",     hint: "01" },
  { id: "agents",      label: "Agents",         hint: "02" },
  { id: "certs",       label: "Certifications", hint: "03" },
  { id: "marketplace", label: "Marketplace",    hint: "04" },
  { id: "governance",  label: "Governance",     hint: "05" },
  { id: "vault",       label: "Vault-LD",       hint: "06" },
];

const AGENT_SCREEN_IDS = new Set(SCREENS_AGENT.map(s => s.id));
const HUMAN_SCREEN_IDS = new Set(SCREENS_HUMAN.map(s => s.id));

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = useState(() => {
    try {
      const saved = localStorage.getItem("bu_view");
      return saved === "human" || saved === "agent" ? saved : "agent";
    } catch (_) { return "agent"; }
  });
  const [screen, setScreen]     = useState(view === "agent" ? "university" : "trailhead");
  const [atpAgentId, setAtpAgentId] = useState(null);
  const [tour, setTour]         = useState(null);
  const [stopIdx, setStopIdx]   = useState(0);
  const [branchOpen, setBranch] = useState(false);
  const [explorerOpen, setExplorer] = useState(false);
  const [explorerNode, setExplorerNode] = useState(null);
  const [arxivisOpen, setArxivisOpen] = useState(false);
  const [openprobOpen, setOpenprobOpen] = useState(false);
  const [learner, setLearner] = useState({ name: "Learner", interest: "" });
  const [tutorialOpen, setTutorialOpen] = useState(false);
  const [atpTourOpen, setAtpTourOpen]   = useState(false);

  // Persist the Human/Agent view + expose it to CSS ([data-view] overrides).
  useEffect(() => {
    document.documentElement.dataset.view = view;
    try { localStorage.setItem("bu_view", view); } catch (_) {}
  }, [view]);

  // Auto-open the welcome tutorial on first visit (human view only).
  useEffect(() => {
    if (view === "human" && window.BUTutorial?.shouldAutoOpenTutorial?.()) {
      setTutorialOpen(true);
    }
  }, [view]);

  // Auto-open the agent-view tour on the first agent-view visit. Its own
  // localStorage flag (atp.tour.seen.v1) — distinct from the human
  // tutorial's — so each view gets its own first-run walkthrough.
  useEffect(() => {
    if (view === "agent" && window.ATPTour?.shouldAutoOpen?.()) {
      setAtpTourOpen(true);
    }
  }, [view]);

  // Apply tweaks to <html>
  useEffect(() => {
    document.documentElement.dataset.palette     = t.palette;
    document.documentElement.dataset.displayFont = t.displayFont;
  }, [t.palette, t.displayFont]);

  const startTour = useCallback((nodeId, _cluster, interest) => {
    if (interest && interest.trim()) {
      setLearner(prev => ({ ...prev, interest: interest.trim() }));
    }
    const planned = BU_DATA.planTour(nodeId);
    setTour(planned);
    setStopIdx(0);
    setScreen("walk");
  }, []);

  const advance = useCallback((delta) => {
    setStopIdx(i => Math.max(0, Math.min(tour.length - 1, i + delta)));
  }, [tour]);

  const handleBranch = useCallback(() => setBranch(true), []);
  const handleFork = useCallback((toNode, cluster) => {
    // Splice a forked tour: keep visited stops, append a planned tour starting at toNode
    const visited = tour.slice(0, stopIdx + 1);
    const forked = BU_DATA.planTour(toNode).slice(0, 4);
    setTour([...visited, ...forked]);
    setStopIdx(visited.length);
    setBranch(false);
  }, [tour, stopIdx]);

  const handleSummit = useCallback(() => {
    setScreen("summit");
  }, []);

  // Visited set for visualizations
  const visited = useMemo(() => {
    if (!tour) return new Set();
    return new Set(tour.slice(0, stopIdx + 1).map(s => s.node));
  }, [tour, stopIdx]);

  // Switch Human ◦ Agent view: close every overlay, land on the view's home.
  const switchView = useCallback((v) => {
    if (v === view) return;
    setView(v);
    setExplorer(false); setArxivisOpen(false); setOpenprobOpen(false);
    setScreen(v === "agent" ? "university" : "trailhead");
  }, [view]);

  // Fast nav across top
  const goto = (id) => {
    if (AGENT_SCREEN_IDS.has(id)) {
      // Agent-view ids are plain screens — no overlays involved.
      setScreen(id);
    } else if (id === "explorer") {
      setArxivisOpen(false); setOpenprobOpen(false);
      setExplorer(true);
      setExplorerNode(tour?.[stopIdx]?.node || "Reynolds_number");
    } else if (id === "arxivis") {
      setExplorer(false); setOpenprobOpen(false);
      setArxivisOpen(true);
    } else if (id === "openprob") {
      setExplorer(false); setArxivisOpen(false);
      setOpenprobOpen(true);
    } else {
      setArxivisOpen(false); setOpenprobOpen(false);
      if (id === "walk" && !tour) startTour("Reynolds_number");
      else setScreen(id);
    }
  };

  // ── Hash router (docs/HARDENING.md Phase 3 deep links) ──────────
  // Resolved on load + on every hashchange:
  //   #/agent/{id}    → agent view · agents screen · that agent selected
  //   #/cert/{id}     → agent view · certs screen  · window.ATP_CERT_FOCUS
  //   #/evidence/{id} → agent view · certs screen  · window.ATP_EVIDENCE_FOCUS
  //   #/{screenId}    → plain screen (either view; human ids switch view)
  // Nav actions mirror state back into the hash below via
  // history.replaceState — replaceState never fires hashchange, and the
  // _navFromHash guard skips the mirror on renders caused by consuming a
  // deep link, so a just-applied #/cert/… or #/evidence/… hash is never
  // clobbered by the canonical screen hash. No reload loops either way.
  const _navFromHash = useRef(false);

  const applyHash = () => {
    const raw = (window.location.hash || "").replace(/^#\/?/, "");
    if (!raw) return;
    const seg = raw.split("/");
    const head = seg[0];
    const id = seg.length > 1 ? decodeURIComponent(seg.slice(1).join("/")) : null;
    const closeOverlays = () => {
      setExplorer(false); setArxivisOpen(false); setOpenprobOpen(false);
    };
    _navFromHash.current = true;
    if (head === "agent" && id) {
      closeOverlays(); setView("agent"); setAtpAgentId(id); setScreen("agents");
    } else if (head === "cert" && id) {
      window.ATP_CERT_FOCUS = id;
      closeOverlays(); setView("agent"); setScreen("certs");
    } else if (head === "evidence" && id) {
      window.ATP_EVIDENCE_FOCUS = id;
      closeOverlays(); setView("agent"); setScreen("certs");
    } else if (AGENT_SCREEN_IDS.has(head)) {
      closeOverlays(); setView("agent"); setScreen(head);
    } else if (HUMAN_SCREEN_IDS.has(head)) {
      setView("human");
      if (head === "explorer" || head === "arxivis" || head === "openprob") {
        // Overlays float above a base screen — make sure the base screen
        // is a human one before goto() opens the overlay.
        setScreen(s => (AGENT_SCREEN_IDS.has(s) ? "trailhead" : s));
      }
      goto(head);
    } else {
      _navFromHash.current = false; // unknown hash — leave state alone
      return;
    }
    // Release the guard after the state flush + its effects have run
    // (effect-originated updates flush before paint, before this timer).
    setTimeout(() => { _navFromHash.current = false; }, 0);
  };

  // Latest-closure trampoline: the mount effect registers one listener,
  // but applyHash must see the current tour/stopIdx through goto().
  const applyHashRef = useRef(applyHash);
  applyHashRef.current = applyHash;

  useEffect(() => {
    const onHash = () => applyHashRef.current();
    onHash(); // resolve a deep link present at load
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  // State → hash mirror (canonical): every nav action lands here.
  useEffect(() => {
    if (_navFromHash.current) return;
    let h;
    if (view === "human") {
      h = explorerOpen ? "explorer"
        : arxivisOpen ? "arxivis"
        : openprobOpen ? "openprob"
        : screen;
    } else {
      h = (screen === "agents" && atpAgentId)
        ? "agent/" + encodeURIComponent(atpAgentId)
        : screen;
    }
    const next = "#/" + h;
    if (window.location.hash !== next) {
      try { history.replaceState(null, "", next); } catch (_) {}
    }
  }, [view, screen, atpAgentId, explorerOpen, arxivisOpen, openprobOpen]);

  return (
    <div className="app-shell">
      {/* TOPBAR */}
      <header className="topbar">
        <div className="brand">
          <span className="glyph">B<span style={{opacity: 0.7}}>U</span></span>
          <span>Brain University<span style={{ opacity: 0.5, marginLeft: 6 }}>
            {view === "agent" ? "Agent University · est. 2026" : "· learning prototype"}
          </span></span>
        </div>
        <nav className="nav" ref={(el) => {
          // Keep the active tab visible when the nav is narrower than its tabs.
          const b = el && el.querySelector("button.active");
          if (b && (b.offsetLeft < el.scrollLeft || b.offsetLeft + b.offsetWidth > el.scrollLeft + el.clientWidth))
            el.scrollTo({ left: b.offsetLeft - el.clientWidth / 2 + b.offsetWidth / 2 });
        }}>
          {(view === "agent" ? SCREENS_AGENT : SCREENS_HUMAN).map(s => (
            <button key={s.id}
              data-nav={s.id}
              className={screen === s.id || (s.id === "explorer" && explorerOpen) || (s.id === "arxivis" && arxivisOpen) || (s.id === "openprob" && openprobOpen) ? "active" : ""}
              onClick={() => goto(s.id)}
              title={`Screen ${s.hint} · ${s.label}`}>
              <span className="nav-hint" style={{ opacity: 0.45, fontFamily: "var(--f-mono)", fontSize: 10, marginRight: 6 }}>
                {s.hint}
              </span>
              {s.label}
            </button>
          ))}
        </nav>
        <div className="right">
          <div className="view-toggle" role="group" aria-label="View"
               style={{ marginRight: 10 }}>
            <button
              className={view === "human" ? "active" : ""}
              onClick={() => switchView("human")}
              title="Human learning view">
              Human
            </button>
            <button
              className={view === "agent" ? "active" : ""}
              onClick={() => switchView("agent")}
              title="Agent University view">
              Agent
            </button>
          </div>
          <button
            onClick={() => (view === "agent" ? setAtpTourOpen(true) : setTutorialOpen(true))}
            title={view === "agent" ? "Tour the Agent University" : "How to use Brain University"}
            style={{
              width: 24, height: 24, borderRadius: "50%",
              background: "transparent",
              border: "1px solid var(--c-line-strong)",
              color: "var(--c-ink-muted)",
              fontSize: 12, fontWeight: 600, cursor: "pointer",
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              marginRight: 8,
              fontFamily: "var(--f-mono)",
            }}>
            ?
          </button>
          <span>{learner.name}</span>
          <span style={{ opacity: 0.4 }}>·</span>
          <span style={{ color: "var(--c-bridge)" }}>online graph</span>
        </div>
      </header>

      {/* MAIN */}
      <main style={{ position: "relative" }}>
        {screen === "trailhead" && (
          <Trailhead learner={learner} onPickStart={startTour} />
        )}
        {screen === "walk" && tour && (
          <Walk tour={tour} idx={stopIdx} layout={t.lessonLayout}
                onAdvance={advance}
                onJumpTo={(i) => typeof i === "number" ? setStopIdx(i) : setScreen("trailhead")}
                onBranch={handleBranch}
                onSummit={handleSummit}
                onShow3D={() => { setExplorer(true); setExplorerNode(tour[stopIdx].node); }} />
        )}
        {screen === "walk" && !tour && (
          <EmptyTour onPick={() => setScreen("trailhead")} />
        )}
        {screen === "branch" && (
          <BranchStandalone onOpen={() => { setScreen("walk"); if (!tour) startTour("Reynolds_number"); setTimeout(() => setBranch(true), 300); }} />
        )}
        {screen === "summit" && (
          <Summit tour={tour || BU_DATA.planTour("Reynolds_number")}
                  onAnotherTrail={() => setScreen("trailhead")}
                  onDashboard={() => setScreen("dashboard")} />
        )}
        {screen === "dashboard" && (
          <Dashboard learner={learner}
                     onResume={(startNode) => { startTour(startNode || "Reynolds_number"); }}
                     onNewTrail={() => setScreen("trailhead")} />
        )}
        {screen === "propose" && (
          <Propose onJumpToNode={(id) => startTour(id)} />
        )}
        {screen === "podcast" && (
          <PodcastStudio />
        )}
        {screen === "courses" && (
          typeof Courses !== "undefined"
            ? <Courses onWalk={(key) => startTour(key)} />
            : null
        )}

        {/* ATP agent-view screens. Referenced ONLY when view === "agent" so */}
        {/* a missing screens/atp-*.jsx global can never crash the human view. */}
        {view === "agent" && screen === "university" && (
          typeof ATPUniversity !== "undefined"
            ? <ATPUniversity goto={goto}
                onViewAgent={(id) => { setAtpAgentId(id); goto("agents"); }} />
            : <AgentScreenFallback />
        )}
        {view === "agent" && screen === "agents" && (
          typeof ATPAgents !== "undefined"
            ? <ATPAgents selectedId={atpAgentId} onSelect={setAtpAgentId} goto={goto} />
            : <AgentScreenFallback />
        )}
        {view === "agent" && screen === "certs" && (
          typeof ATPCerts !== "undefined"
            ? <ATPCerts onViewAgent={(id) => { setAtpAgentId(id); goto("agents"); }} />
            : <AgentScreenFallback />
        )}
        {view === "agent" && screen === "marketplace" && (
          typeof ATPMarketplace !== "undefined"
            ? <ATPMarketplace onViewAgent={(id) => { setAtpAgentId(id); goto("agents"); }} />
            : <AgentScreenFallback />
        )}
        {view === "agent" && screen === "governance" && (
          typeof ATPGovernance !== "undefined"
            ? <ATPGovernance />
            : <AgentScreenFallback />
        )}
        {view === "agent" && screen === "vault" && (
          typeof ATPVault !== "undefined"
            ? <ATPVault goto={goto} />
            : <AgentScreenFallback />
        )}

        {/* Branch panel — overlays the walk */}
        <BranchPanel
          open={branchOpen}
          fromNode={tour?.[stopIdx]?.node}
          onStay={() => setBranch(false)}
          onFork={handleFork} />

        {/* 3D explorer fullscreen overlay */}
        {explorerOpen && (
          <ThreeDFlex initialNode={explorerNode}
                      visited={visited}
                      onClose={() => setExplorer(false)}
                      onPickNode={(id) => { setExplorer(false); startTour(id); }} />
        )}

        {/* arXivis fullscreen overlay */}
        {arxivisOpen && (
          <ArXivis
            onClose={() => setArxivisOpen(false)}
            onJumpToConcept={(nodeId) => { setArxivisOpen(false); startTour(nodeId); }} />
        )}

        {/* Open Problems fullscreen overlay */}
        {openprobOpen && (
          <OpenProblems
            onClose={() => setOpenprobOpen(false)}
            onJumpToConcept={(nodeId) => { setOpenprobOpen(false); startTour(nodeId); }} />
        )}

        {/* Welcome tutorial overlay (auto on first visit, ? to reopen) */}
        <Tutorial
          open={tutorialOpen}
          onClose={() => setTutorialOpen(false)}
          onPreview={(screenId) => { if (screenId) goto(screenId); }}
          onJumpTo={(screenId) => {
            setTutorialOpen(false);
            if (screenId) goto(screenId);
          }} />

        {/* Agent-view onboarding tour (auto on first agent-view visit, ? */}
        {/* reopens it). Referenced only when view === "agent" and the     */}
        {/* global exists, so a missing atp-tour.jsx can never crash the   */}
        {/* human view (same guard idiom as the atp-*.jsx screens).        */}
        {view === "agent" && typeof ATPTour !== "undefined" && (
          <ATPTour
            open={atpTourOpen}
            onClose={() => setAtpTourOpen(false)}
            onPreview={(screenId) => { if (screenId) goto(screenId); }}
            onJumpTo={(screenId) => {
              setAtpTourOpen(false);
              if (screenId) goto(screenId);
            }} />
        )}
      </main>

      {/* TWEAKS PANEL */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakRadio label="Palette" value={t.palette}
            options={[
              { value: "night", label: "Night" },
              { value: "paper", label: "Paper" },
              { value: "ocean", label: "Ocean" },
            ]}
            onChange={(v) => setTweak('palette', v)} />
          <TweakRadio label="Display font" value={t.displayFont}
            options={[
              { value: "grotesk", label: "Grotesk" },
              { value: "serif",   label: "Serif" },
              { value: "mono",    label: "Mono" },
            ]}
            onChange={(v) => setTweak('displayFont', v)} />
        </TweakSection>
        <TweakSection label="Lesson view">
          <TweakRadio label="Layout" value={t.lessonLayout}
            options={[
              { value: "postcard",   label: "Postcard" },
              { value: "split",      label: "Split" },
              { value: "full-bleed", label: "Spread" },
            ]}
            onChange={(v) => setTweak('lessonLayout', v)} />
        </TweakSection>
        <TweakSection label="Visuals">
          <TweakToggle label="Cinematic auto-orbit" value={t.cinematicCamera}
            onChange={(v) => setTweak('cinematicCamera', v)} />
        </TweakSection>
        <TweakSection label="Demo helpers">
          <TweakButton label="Jump to summit" onClick={() => setScreen("summit")} />
          <TweakButton label="Reset to trailhead" secondary
            onClick={() => { setTour(null); setStopIdx(0); setScreen("trailhead"); }} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// Helper screens for direct nav

function AgentScreenFallback() {
  // Shown if an atp-*.jsx screen file hasn't loaded (e.g. fetch failure).
  return (
    <div style={{ minHeight: "calc(100vh - 56px)", display: "grid", placeItems: "center", padding: 40 }}>
      <div className="card" style={{ textAlign: "center", padding: 40, maxWidth: 460 }}>
        <div className="t-tag" style={{ color: "var(--c-ink-muted)", marginBottom: 6 }}>AGENT VIEW</div>
        <p className="t-cap" style={{ margin: 0 }}>Agent view loading…</p>
      </div>
    </div>
  );
}

function EmptyTour({ onPick }) {
  return (
    <div style={{ minHeight: "calc(100vh - 56px)", display: "grid", placeItems: "center", padding: 40 }}>
      <div className="card" style={{ textAlign: "center", padding: 40, maxWidth: 460 }}>
        <div className="t-tag" style={{ color: "var(--c-ink-muted)", marginBottom: 6 }}>NO ACTIVE TRAIL</div>
        <h2 className="t-h1" style={{ margin: "0 0 8px" }}>Pick a peak first</h2>
        <p className="t-cap" style={{ margin: "0 0 18px" }}>
          The walk is generated from your starting concept. Visit the trailhead to choose one
          (or let the system rank options for you).
        </p>
        <button className="btn primary" onClick={onPick}>▲ Go to trailhead</button>
      </div>
    </div>
  );
}

function BranchStandalone({ onOpen }) {
  // The Branch screen #03 is really a moment inside the walk — but the top-bar
  // entry needs to land somewhere. Show a brief explainer + open the panel.
  return (
    <div style={{ minHeight: "calc(100vh - 56px)", padding: "60px 28px", maxWidth: 720, margin: "0 auto" }}>
      <div className="t-tag" style={{ color: "var(--c-bridge)" }}>≈ BRIDGE MOMENT</div>
      <h1 className="t-display" style={{ margin: "8px 0 12px" }}>The fork is the magic.</h1>
      <p style={{ fontSize: 17, lineHeight: 1.6, color: "var(--c-ink-muted)", maxWidth: 600 }}>
        Most platforms make you finish a course before suggesting another. Brain University thinks
        in concepts, not courses — so when you land on a <em>bridge concept</em> (one with edges
        across multiple Louvain communities), the system surfaces fork options inline.
      </p>
      <p style={{ fontSize: 17, lineHeight: 1.6, color: "var(--c-ink-muted)", maxWidth: 600 }}>
        You stay on your trail or follow the bridge into a totally different course. Same lesson,
        different region of the brain.
      </p>
      <div className="topo-rule" style={{ margin: "32px 0" }} />
      <button className="btn primary" onClick={onOpen}>
        Open the bridge prompt →
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
